name: Arcadia
options:
  bundleIdPrefix: dev.ferhanakkan
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  # Sparkle (MIT) installs Arcadia's own updates from the appcast published with each release.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Apple silicon only.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # Sparkle compares build versions, so the build version follows the release version.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    # Debug builds sign with the team's Apple Development certificate so the App Group works
    # without prompts; releases override this with Developer ID (scripts/release.sh).
    DEVELOPMENT_TEAM: 43THU6L26P
targets:
  Arcadia:
    type: application
    platform: macOS
    sources:
      - path: Arcadia
    dependencies:
      # SDL3 (zlib license) reads connected gamepads the same way the emulators do.
      - framework: Vendor/SDL3.framework
        embed: true
        codeSign: true
      - package: Sparkle
      - target: ArcadiaWidget
        embed: true
        codeSign: true
    entitlements:
      path: Arcadia/Arcadia.entitlements
      properties:
        # Shared with the widget. Team-prefixed, so Developer ID builds need no provisioning profile.
        com.apple.security.application-groups:
          - 43THU6L26P.dev.ferhanakkan.Arcadia
    info:
      path: Arcadia/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: the appcast scripts/release.sh uploads next to each release's disk image.
        SUFeedURL: https://github.com/akkanferhan/arcadia/releases/latest/download/appcast.xml
        SUPublicEDKey: PU9qpsmcl451+bvIPkaChgIZLYANhkbAvvnnbPQ73Y4=
        SUEnableAutomaticChecks: true
        NSDesktopFolderUsageDescription: Arcadia looks for your games here when you search this Mac.
        NSDocumentsFolderUsageDescription: Arcadia looks for your games here when you search this Mac.
        NSDownloadsFolderUsageDescription: Arcadia looks for your games here when you search this Mac.
        NSRemovableVolumesUsageDescription: Arcadia looks for your games on this drive when you search.
        NSNetworkVolumesUsageDescription: Arcadia looks for your games on this drive when you search.
        # arcadia://play?game=<id> and arcadia://open?game=<id>, used by the widget.
        CFBundleURLTypes:
          - CFBundleURLName: dev.ferhanakkan.Arcadia
            CFBundleURLSchemes: [arcadia]
        # Sony serves PS3 system software over HTTP only; RPCS3 verifies the file's hashes.
        NSAppTransportSecurity:
          NSExceptionDomains:
            playstation.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ferhanakkan.Arcadia
        PRODUCT_NAME: Arcadia
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Arcadia/App/Arcadia-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Vendor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Arcadia
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Hardened runtime keeps the test bundle from loading in Debug, so only releases use it.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  ArcadiaWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: ArcadiaWidget
      - path: Arcadia/Integration/Shared
      - path: Arcadia/Resources/Localizable.xcstrings
    info:
      path: ArcadiaWidget/Info.plist
      properties:
        CFBundleDisplayName: Arcadia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ArcadiaWidget/ArcadiaWidget.entitlements
      properties:
        # macOS only loads sandboxed widgets.
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 43THU6L26P.dev.ferhanakkan.Arcadia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ferhanakkan.Arcadia.Widget
        PRODUCT_NAME: ArcadiaWidget
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
  ArcadiaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ArcadiaTests
    dependencies:
      - target: Arcadia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ferhanakkan.ArcadiaTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Arcadia/App/Arcadia-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Vendor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
schemes:
  Arcadia:
    build:
      targets:
        Arcadia: all
        ArcadiaTests: [test]
    test:
      targets:
        - ArcadiaTests
    run:
      config: Debug
    archive:
      config: Release
