name: Arcadia
options:
  bundleIdPrefix: dev.ferhanakkan
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Apple silicon only.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CURRENT_PROJECT_VERSION: "1"
targets:
  Arcadia:
    type: application
    platform: macOS
    sources:
      - path: Arcadia
    dependencies:
      # SDL3 (zlib license) reads connected gamepads the same way the emulators do.
      - framework: Vendor/SDL3.framework
        embed: true
        codeSign: true
    info:
      path: Arcadia/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSDesktopFolderUsageDescription: Arcadia looks for your games here when you search this Mac.
        NSDocumentsFolderUsageDescription: Arcadia looks for your games here when you search this Mac.
        NSDownloadsFolderUsageDescription: Arcadia looks for your games here when you search this Mac.
        NSRemovableVolumesUsageDescription: Arcadia looks for your games on this drive when you search.
        NSNetworkVolumesUsageDescription: Arcadia looks for your games on this drive when you search.
        # Sony serves PS3 system software over HTTP only; RPCS3 verifies the file's hashes.
        NSAppTransportSecurity:
          NSExceptionDomains:
            playstation.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ferhanakkan.Arcadia
        PRODUCT_NAME: Arcadia
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Arcadia/App/Arcadia-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Vendor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Arcadia
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
